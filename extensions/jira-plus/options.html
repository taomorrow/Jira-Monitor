<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Jira+ 配置管理</title><link rel="stylesheet" href="options.css"><main><h1>Jira+</h1><p>基于 Jira Monitor 6.10.4 · 扩展 6.10.4.1</p><p>项目、通知及 Job 在 Jira 页面里的 Configuration 中设置。此处用于备份和迁移，导入后刷新 Jira 页面。</p><button id="open">打开 Jira</button><button id="export">导出扩展配置</button><label>导入 JSON 配置<input id="import" type="file" accept="application/json,.json"></label><p>备份包含 Webhook、收件人等配置，请自行妥善保存。扩展不会读取油猴私有存储，也不会自动发送配置。</p><p>本地安装版需手动更新。GitHub 新包不等于商店自动更新；商店发布后通过原商店安装才能自动更新。</p><p id="status" role="status"></p></main><script src="options.js"></script></html>
